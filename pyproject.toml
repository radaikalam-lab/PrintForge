[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printforge"
version = "0.1.0"
description = "Open, Local-First Printing Control Plane"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "PrintForge Contributors" },
]
keywords = ["printing", "api", "fastapi", "control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pytest",
    "sqlalchemy",
    "aiofiles",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/printforge/printforge"
Repository = "https://github.com/printforge/printforge"
Documentation = "https://github.com/printforge/printforge"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "hardware: requires physical printer hardware",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".kilo", ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = [
    "B008",  # function calls in default arguments (FastAPI Depends pattern)
    "B904",  # raise from in test code
    "E501",  # line length handled by formatter
    "SIM105",  # suppress try-except-pass in test helpers
    "SIM117",  # nested with in test code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "PT", "ARG", "SLF"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["server", "domain", "application", "providers", "spool", "persistence", "simulation", "observability", "policies", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["server", "domain", "contracts", "application", "providers", "spool", "persistence", "simulation", "observability", "policies"]

[tool.hatch.build.targets.sdist]
include = [
    "/server",
    "/domain",
    "/contracts",
    "/application",
    "/providers",
    "/spool",
    "/persistence",
    "/simulation",
    "/observability",
    "/policies",
    "/tests",
    "README.md",
    "ARCHITECTURE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
