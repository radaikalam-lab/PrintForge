[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printforge"
version = "0.1.0"
description = "Open, Local-First Printing Control Plane"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "PrintForge Contributors" },
]
keywords = ["printing", "api", "fastapi", "control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pytest",
    "sqlalchemy",
    "aiofiles",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/printforge/printforge"
Repository = "https://github.com/printforge/printforge"
Documentation = "https://github.com/printforge/printforge"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["server", "domain", "contracts", "application", "providers", "spool", "persistence", "simulation", "observability", "policies"]

[tool.hatch.build.targets.sdist]
include = [
    "/server",
    "/domain",
    "/contracts",
    "/application",
    "/providers",
    "/spool",
    "/persistence",
    "/simulation",
    "/observability",
    "/policies",
    "/tests",
    "README.md",
    "ARCHITECTURE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
